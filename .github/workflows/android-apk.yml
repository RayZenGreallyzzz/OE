name: OE Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.3.11579264' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build arm64 APK
        run: gradle --no-daemon :android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OE-Android-arm64-debug
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
