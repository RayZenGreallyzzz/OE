name: OE smoke tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax-and-scenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/engine.js
      - run: node --check src/editor.js
      - run: node --test tests/engine.test.cjs
