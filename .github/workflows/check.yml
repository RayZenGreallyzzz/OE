name: OE smoke tests
on:
  push:
    branches: [main, test/advanced-assets-065, test/device-quality-profiles-071, test/game-runtime-core-070]
  pull_request:
jobs:
  syntax-and-scenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/engine.js
      - run: node --check src/editor.js
      - run: node --test tests/engine.test.cjs
  meshopt-codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile offline Meshopt encoder/decoder smoke test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra \
            tests/meshopt_codec_smoke.cpp \
            android/src/main/cpp/vendor/meshoptimizer/vertexcodec.cpp \
            android/src/main/cpp/vendor/meshoptimizer/indexcodec.cpp \
            android/src/main/cpp/vendor/meshoptimizer/vertexfilter.cpp \
            android/src/main/cpp/vendor/meshoptimizer/allocator.cpp \
            -o /tmp/oe-meshopt-test
          /tmp/oe-meshopt-test
      - name: Static GLB LOD simplification smoke
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra \
            tests/meshopt_lod_smoke.cpp \
            android/src/main/cpp/vendor/meshoptimizer/indexgenerator.cpp \
            android/src/main/cpp/vendor/meshoptimizer/simplifier.cpp \
            android/src/main/cpp/vendor/meshoptimizer/allocator.cpp \
            -o /tmp/oe-lod-test
          /tmp/oe-lod-test
  device-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test device-quality recommendation and preset invariants
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            tests/device_quality_profiles_smoke.cpp -o /tmp/oe-quality-test
          /tmp/oe-quality-test
  terrain-material-layers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Independent terrain layers and material-isolation tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tests/material_layers_smoke.cpp \
            android/src/main/cpp/terrainpaint/material_layers.cpp \
            -o /tmp/oe-material-layers
          /tmp/oe-material-layers
  terrain-paint-tiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate continuous tile painting and bounded data
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tests/terrainpaint_smoke.cpp \
            android/src/main/cpp/terrainpaint/paint_tiles.cpp \
            -o /tmp/oe-terrain-paint
          /tmp/oe-terrain-paint
  road-bridge-traversal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify connected medieval bridges, grade-safe entrances and walk surfaces
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tests/bridge_traversal_smoke.cpp \
            android/src/main/cpp/roads/road_network.cpp \
            android/src/main/cpp/roads/road_topology.cpp \
            android/src/main/cpp/roads/traversal_graph.cpp \
            android/src/main/cpp/medieval/structures.cpp \
            -o /tmp/oe-bridge-traversal-test
          /tmp/oe-bridge-traversal-test
      - name: Check editor bridge alignment and road traversal JNI wiring
        run: python3 tests/bridge_editor_integration_smoke.py
  water-lakes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify flooded depressions, shorelines and bounded lake meshes
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tests/lake_surface_smoke.cpp \
            android/src/main/cpp/water/lake_surface.cpp \
            -o /tmp/oe-water-lakes-test
          /tmp/oe-water-lakes-test
      - name: Cross-check lake JNI, save/restore and editor mode
        run: python3 tests/lake_editor_integration_smoke.py
  medieval-bridge-foundations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify budgeted bridge and building-foundation geometry
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tests/medieval_modules_smoke.cpp \
            android/src/main/cpp/medieval/structures.cpp \
            -o /tmp/oe-medieval-modules-test
          /tmp/oe-medieval-modules-test
      - name: Validate editor placement and scene-v6 archive wiring
        run: python3 tests/medieval_editor_integration_smoke.py
  medieval-road-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify seamless terrain X/T/Y junction caps and bounded surfaces
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tests/medieval_surface_smoke.cpp \
            android/src/main/cpp/roads/road_network.cpp \
            android/src/main/cpp/roads/road_topology.cpp \
            android/src/main/cpp/roads/medieval_surface.cpp \
            -o /tmp/oe-medieval-surface-test
          /tmp/oe-medieval-surface-test
  road-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deterministic shared T/X/Y graph, snap and serializable control points
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tests/road_topology_smoke.cpp \
            android/src/main/cpp/roads/road_network.cpp \
            android/src/main/cpp/roads/road_topology.cpp \
            -o /tmp/oe-road-topology-test
          /tmp/oe-road-topology-test
  road-junctions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded crossings, point snapping and rounded curves
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tests/road_junctions_smoke.cpp \
            android/src/main/cpp/roads/road_network.cpp \
            android/src/main/cpp/roads/road_junctions.cpp \
            -o /tmp/oe-junctions-test
          /tmp/oe-junctions-test
  road-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify portable road centerlines and terrain meshing
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tests/road_network_smoke.cpp \
            android/src/main/cpp/roads/road_network.cpp \
            -o /tmp/oe-roads-test
          /tmp/oe-roads-test
  runtime-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify portable OE Runtime C++17 without Android/GLES dependencies
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tests/runtime_core_smoke.cpp \
            android/src/main/cpp/runtime/oe_runtime.cpp \
            -o /tmp/oe-runtime-core-test
          /tmp/oe-runtime-core-test
