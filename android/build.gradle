plugins {
    id 'com.android.application'
}
android {
    namespace 'game.oe.editor'
    compileSdk 35
    defaultConfig {
        applicationId 'game.oe.editor.gizmo012'
        minSdk 26
        targetSdk 34
        versionCode 27
        versionName '0.7.12-professional-gizmo-xyz-test'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O2 -Wall -Wextra' }
        }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
